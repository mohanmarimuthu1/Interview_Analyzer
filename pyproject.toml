[project]
name = "interviewlens"
version = "0.1.0"
description = "Candidate-side multimodal interview practice feedback (visual + audio + text)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]
track = ["wandb>=0.17"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
